name: DEV validation
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download verified Gitleaks release and scan history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner
  laravel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: foodtrucks_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d foodtrucks_testing"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build full Linux check environment
        run: docker build --target checks -t foodtrucks-checks .
      - name: Formatter, static analysis and dependency security
        run: |
          docker run --rm foodtrucks-checks php vendor/bin/pint --test
          docker run --rm foodtrucks-checks php vendor/bin/phpstan analyse --memory-limit=512M --no-progress
          docker run --rm foodtrucks-checks composer audit --locked
      - name: PostgreSQL and PostGIS behaviour
        run: >-
          docker run --rm --network host
          -e DB_HOST=127.0.0.1 -e DB_USERNAME=postgres -e DB_PASSWORD=ci-isolated-only
          foodtrucks-checks php vendor/bin/phpunit --fail-on-warning --fail-on-risky
      - name: Build and start the actual Compose stack
        run: |
          sh infrastructure/prepare-dev.sh
          sudo chown 1000:1000 .private/db-password .private/app-password .private/app-key
          docker compose config --quiet
          docker compose build
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose exec -T db sh /docker-entrypoint-initdb.d/10-app.sh
          docker compose exec -T db sh /docker-entrypoint-initdb.d/10-app.sh
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/up
          curl --fail --silent -H 'Accept: application/json' http://127.0.0.1:8080/api/v1/foodtrucks
          docker compose exec -T api foodtrucks-entrypoint php artisan foodtrucks:outbox
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = 404
      - name: Diagnose stack startup failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=250 caddy migrate api worker scheduler
      - name: Stop isolated CI containers
        if: always()
        run: docker compose down
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
      - run: npm ci
      - run: npm run check:api
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
        working-directory: apps/mobile
  mobile-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
      - run: npm ci && npm audit --audit-level=high
        working-directory: apps/mobile
